services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-14}-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: postgres
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 1
      MAX_PREPARED_STATEMENTS: 200
    depends_on:
      postgres:
        condition: service_healthy

  php:
    build: docker/php
    volumes:
      - .:/app
    environment:
      DIRECT_DATABASE_URL: pgsql://app:app@postgres:5432/app
      PGBOUNCER_DATABASE_URL: pgsql://app:app@pgbouncer:5432/app
    depends_on:
      - pgbouncer
